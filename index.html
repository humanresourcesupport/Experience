<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow by Zara | Influencer Portfolio</title>
    <style>
        :root {
            --primary-color: #ffafbd; /* Soft pink glow */
            --secondary-color: #ffc3a0;
            --text-dark: #2d3436;
            --bg-light: #f9f9f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Header Section */
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 15px;
            object-fit: cover;
        }

        h1 { font-size: 1.8rem; margin-bottom: 5px; }
        p.handle { font-style: italic; opacity: 0.9; }

        /* Main Links (The Goal) */
        .links-container {
            max-width: 500px;
            margin: -30px auto 40px;
            padding: 0 20px;
        }

        .cta-button {
            display: block;
            background: white;
            color: var(--text-dark);
            text-decoration: none;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            background: #fffafa;
        }

        .featured {
            background: var(--text-dark) !important;
            color: white !important;
        }

        /* Gallery Section */
        .gallery-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .gallery-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .grid-item {
            aspect-ratio: 1 / 1;
            background: #ddd;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: scale 0.3s;
        }

        .grid-item:hover img {
            scale: 1.05;
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <img src="https://via.placeholder.com/150" alt="Glow by Zara" class="profile-img">
        <h1>Glow by Zara</h1>
        <p class="handle">Lifestyle • Beauty • Threads</p>
    </header>

    <div class="links-container">
        <a href="https://www.effectivegatecpm.com/wyn8n3ujda?key=d3357bc73a7ad05a4b904e105af41453" class="cta-button featured">
            ✨ Exclusive Content Collection
        </a>

        <a href="https://www.effectivegatecpm.com/zjpy9fhj?key=4fce8f60264bc6f9b9bf1954aaf3856d" class="cta-button">
            💄 My Beauty Recommendations
        </a>
    </div>

    <section class="gallery-section">
        <h2 class="gallery-title">Latest Feed</h2>
        <div class="grid">
            <div class="grid-item"><img src="https://via.placeholder.com/400" alt="Zara Post"></div>
            <div class="grid-item"><img src="https://via.placeholder.com/400" alt="Zara Post"></div>
            <div class="grid-item"><img src="https://via.placeholder.com/400" alt="Zara Post"></div>
            <div class="grid-item"><img src="https://via.placeholder.com/400" alt="Zara Post"></div>
            <div class="grid-item"><img src="https://via.placeholder.com/400" alt="Zara Post"></div>
            <div class="grid-item"><img src="https://via.placeholder.com/400" alt="Zara Post"></div>
        </div>
    </section>

    <footer>
        &copy; 2026 Glow by Zara. All rights reserved.
    </footer>

</body>
</html>
