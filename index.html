<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hrsdesign | School of Branding</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <nav class="navbar">

            <span class="logo-box">B<span>s</span></span>

            <div class="cta-group">

                <a href="#" class="btn btn-outline">Connect With Us</a>

        </div>

        <div class="hero-visual">

            <img src="https://via.placeholder.com/400x400/0A0A0A/CCFF00?text=3D+Art" alt="Creative Visual">
